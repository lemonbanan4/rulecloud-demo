version: 1
timeout_ms: 5000
include:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.py"
rules:
  - id: hardcoded-credential
    type: regex
    description: Flags obvious hardcoded credentials in source.
    pattern: '(?i)(api_key|password|secret|token)\s*=\s*"[^"]{6,}"'
    message: Hardcoded credential — use environment variables or a secret manager

  - id: presentation-imports-data
    type: regex
    description: Presentation layer must not depend on internal/data (clean architecture).
    pattern: '(?i)(from\s+[''"].*internal/data|import\s+.*internal/data|\.\./data/)'
    message: Layer violation — presentation must not import the data layer directly

  - id: hygiene-todo
    type: regex
    description: Unresolved work markers before merge.
    pattern: '(?i)\b(TODO|FIXME)\b'
    message: Resolve TODO/FIXME before merging